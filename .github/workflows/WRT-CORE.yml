# ============================================================
# X86_X64 云编译公用核心
#
# 当前 X86 配置正式生成：
#
# 1. squashfs-combined.img.gz
#    Legacy / BIOS
#
# 2. squashfs-combined-efi.img.gz
#    UEFI
#
# 增强：
#
# 1. 两个 X86 整盘镜像必须真实存在
# 2. 两个镜像都必须大于 1MB
# 3. TEST=true 不创建 Release
# 4. Release 固定使用 v2.6.2
# 5. files 无匹配时 Release 直接失败
# 6. Release 创建后再次读取 GitHub 实际附件
# 7. 必须确认 Legacy + UEFI 两个镜像均已上传
# ============================================================

name: WRT-CORE

on:
  workflow_call:
    inputs:

      WRT_CONFIG:
        required: true
        type: string

      WRT_THEME:
        required: true
        type: string

      WRT_NAME:
        required: true
        type: string

      WRT_SSID:
        required: true
        type: string

      WRT_WORD:
        required: true
        type: string

      WRT_IP:
        required: true
        type: string

      WRT_PW:
        required: true
        type: string

      WRT_REPO:
        required: true
        type: string

      WRT_BRANCH:
        required: true
        type: string

      WRT_SOURCE:
        required: true
        type: string

      WRT_PACKAGE:
        required: false
        type: string

      WRT_TEST:
        required: false
        type: string


env:

  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}

  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}

  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}


jobs:

  core:

    name: ${{ inputs.WRT_SOURCE }}

    runs-on: ubuntu-24.04

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout Projects
        uses: actions/checkout@main


      # ========================================================
      # 初始化环境
      # ========================================================

      - name: Initialization Environment

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo -E apt -yqq purge firefox

          sudo -E apt -yqq update

          sudo -E apt -yqq full-upgrade

          sudo -E apt -yqq autoremove --purge

          sudo -E apt -yqq autoclean

          sudo -E apt -yqq clean

          sudo -E apt -yqq install \
            dos2unix \
            libfuse-dev


          sudo bash -c \
            'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


          sudo -E systemctl daemon-reload

          sudo -E timedatectl set-timezone "Asia/Shanghai"


          sudo mkdir -p /mnt/build_wrt

          sudo chown "$USER":"$USER" /mnt/build_wrt

          sudo ln -s \
            /mnt/build_wrt \
            "$GITHUB_WORKSPACE/wrt"


      # ========================================================
      # 初始化变量
      # ========================================================

      - name: Initialization Values

        run: |

          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" \
            >> "$GITHUB_ENV"


          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_INFO=${WRT_SOURCE%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_TARGET=$(grep -m 1 \
            -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' \
            ./Config/$WRT_CONFIG.txt)" \
            >> "$GITHUB_ENV"


          echo "WRT_WIFI=wifi-yes" \
            >> "$GITHUB_ENV"


          echo "WRT_KVER=none" \
            >> "$GITHUB_ENV"


          echo "WRT_LIST=none" \
            >> "$GITHUB_ENV"


      # ========================================================
      # 克隆 ImmortalWrt
      # ========================================================

      - name: Clone Code

        run: |

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/


          cd ./wrt/


          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" \
            >> "$GITHUB_ENV"


          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"


          if [ -f "$PROJECT_MIRRORS_FILE" ]; then

            sed -i \
              '/.cn\//d; /tencent/d; /aliyun/d' \
              "$PROJECT_MIRRORS_FILE"

          fi


      # ========================================================
      # 脚本处理
      # ========================================================

      - name: Check Scripts

        run: |

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;


      # ========================================================
      # Cache
      # ========================================================

      - name: Check Caches

        id: check-cache

        if: env.WRT_TEST != 'true'

        uses: actions/cache@main

        with:

          key: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}

          restore-keys: |
            ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}

          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*


      - name: Update Caches

        if: env.WRT_TEST != 'true'

        run: |

          if [ -d "./wrt/staging_dir" ]; then

            find "./wrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" \
              | while read -r DIR; do

                  find "$DIR" \
                    -type f \
                    -exec touch {} +

                done


            mkdir -p ./wrt/tmp

            echo "1" > ./wrt/tmp/.build


            echo "toolchain skiped done!"

          else

            echo "caches missed!"

          fi


      # ========================================================
      # Feeds
      #
      # 保持 X86 原有 feeds
      # 不加入 H5000M / MT6000 专用 feeds
      # ========================================================

      - name: Update Feeds

        run: |

          cd ./wrt/


          echo "" >> feeds.conf.default


          cat >> feeds.conf.default <<-EOF
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git istore https://github.com/linkease/istore;main
          EOF


          echo "===== feeds.conf.default ====="

          cat feeds.conf.default

          echo "============================="


          ./scripts/feeds update -a


          # 删除源码树自带同名包
          rm -rf ./feeds/luci/applications/luci-app-argon-config

          rm -rf ./feeds/luci/applications/luci-app-passwall

          rm -rf ./feeds/luci/themes/luci-theme-argon

          rm -rf ./feeds/packages/net/mosdns

          rm -rf ./feeds/packages/net/v2ray-geodata


          # 使用 passwall_packages 新版本
          rm -rf ./feeds/packages/net/xray-core

          rm -rf ./feeds/packages/net/sing-box

          rm -rf ./feeds/packages/net/hysteria

          rm -rf ./feeds/packages/net/naiveproxy


          # ====================================================
          # Go 1.27
          # ====================================================

          rm -rf ./feeds/packages/lang/golang


          git clone \
            --depth 1 \
            -b 27.x \
            https://github.com/sbwml/packages_lang_golang.git \
            ./feeds/packages/lang/golang


          # 删除包以后重新建立索引
          ./scripts/feeds update -i


          ./scripts/feeds install -a


          # 清理断链
          find ./package/feeds/ \
            -xtype l \
            -exec rm -f {} + \
            2>/dev/null || true


      # ========================================================
      # 自定义 Packages
      #
      # 这里继续执行你原来的：
      #
      # Packages.sh
      # Handles.sh
      #
      # PRIVATE.sh / wmsxwd 的现有调用关系不改变
      # ========================================================

      - name: Custom Packages

        run: |

          cd ./wrt/package/


          "$GITHUB_WORKSPACE/Scripts/Packages.sh"

          "$GITHUB_WORKSPACE/Scripts/Handles.sh"


      # ========================================================
      # 自定义 Files
      # ========================================================

      - name: Custom Files

        run: |

          if [ -d "$GITHUB_WORKSPACE/Files" ]; then

            mkdir -p ./wrt/files


            cp -rf \
              "$GITHUB_WORKSPACE/Files/." \
              ./wrt/files/


            # 只处理脚本文本
            # files 目录还有 Geo / 二进制文件
            # 不能整个目录执行 dos2unix

            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec dos2unix {} \; \
              2>/dev/null || true


            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec chmod +x {} \; \
              2>/dev/null || true


            echo "===== files ====="

            find ./wrt/files/ -type f

            echo "================="

          fi


      # ========================================================
      # 应用配置
      # ========================================================

      - name: Custom Settings

        run: |

          cd ./wrt/


          cat \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            >> .config


          "$GITHUB_WORKSPACE/Scripts/Settings.sh"


          make defconfig -j"$(nproc)"

          make clean -j"$(nproc)"


      # ========================================================
      # 下载 Packages
      # ========================================================

      - name: Download Packages

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/

          make download -j"$(nproc)"


      # ========================================================
      # 编译
      # ========================================================

      - name: Compile Firmware

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/


          make -j"$(nproc)" \
            || make -j"$(nproc)" V=s \
            || make -j1 V=s


      # ========================================================
      # 清理 Cache
      # ========================================================

      - name: Cleanup Caches

        if: >
          success() &&
          env.WRT_TEST != 'true' &&
          steps.check-cache.outputs.cache-hit != 'true'

        run: |

          CACHE_LIST=$(gh cache list \
            --key "$WRT_CONFIG-$WRT_INFO" \
            | cut -f 1)


          for CACHE_KEY in $CACHE_LIST; do

            gh cache delete "$CACHE_KEY"

          done


          echo "caches cleanup done!"


      # ========================================================
      # 编译机信息
      # ========================================================

      - name: Machine Information

        run: |

          cd ./wrt/


          echo "======================="

          lscpu | grep -E "name|Core|Thread"

          echo "======================="

          df -h

          echo "======================="

          du -h --max-depth=1

          echo "======================="


      # ========================================================
      # 整理固件
      # ========================================================

      - name: Package Firmware

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          # 每次重新建立 upload
          rm -rf ./upload/

          mkdir -p ./upload/


          # 保存本次最终配置
          cp -f \
            ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt


          # TEST=true 只保留 Config
          if [[ "$WRT_TEST" != 'true' ]]; then


            # ==================================================
            # 获取内核版本
            # ==================================================

            WRT_KERNEL_VERSION=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^kernel - \K[\d\.]+' \
                  {} \; \
                | head -n 1

            )


            if [ -n "$WRT_KERNEL_VERSION" ]; then

              echo "WRT_KVER=$WRT_KERNEL_VERSION" \
                >> "$GITHUB_ENV"

            fi


            # ==================================================
            # 获取 LuCI 插件列表
            # ==================================================

            WRT_LUCI_LIST=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^luci-(app|theme)[^ ]*' \
                  {} \; \
                | sort -u \
                | tr '\n' ' '

            )


            if [ -n "$WRT_LUCI_LIST" ]; then

              echo "WRT_LIST=$WRT_LUCI_LIST" \
                >> "$GITHUB_ENV"

            fi


            echo
            echo "=================================================="
            echo "原始 X86 编译产物"
            echo "=================================================="


            find ./bin/targets/ \
              -type f \
              -printf '%p    %s bytes\n' \
              | sort


            echo "=================================================="
            echo


            # 删除不需要上传的文件
            find ./bin/targets/ \
              -iregex \
              ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +


            # ==================================================
            # 重命名 X86 目标文件
            # ==================================================

            while IFS= read -r -d '' FILE; do


              [ -f "$FILE" ] || continue


              BASENAME=$(basename "$FILE")


              EXT="${BASENAME#*.}"


              NAME=$(

                echo "$BASENAME" \
                  | grep -io "\($WRT_TARGET\).*" \
                  | cut -d '.' -f 1 \
                  || true

              )


              if [ -z "$NAME" ]; then

                continue

              fi


              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"


              echo
              echo "重命名："
              echo "$BASENAME"
              echo "-> $NEW_FILE"
              echo


              mv -f \
                "$FILE" \
                "./upload/$NEW_FILE"


            done < <(

              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0

            )


            # 剩余文件一并移动到 upload
            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;


          fi


          echo
          echo "=================================================="
          echo "准备上传的文件"
          echo "=================================================="


          find ./upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          echo "=================================================="


      # ========================================================
      # X86 正式固件验证
      #
      # 你的 Config/X86.txt 明确要求同时生成：
      #
      # 1. squashfs-combined.img.gz
      #    Legacy / BIOS
      #
      # 2. squashfs-combined-efi.img.gz
      #    UEFI
      #
      # 两个文件都必须存在，并且都必须大于 1MB。
      # ========================================================

      - name: Verify Firmware

        if: env.WRT_TEST != 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=================================================="
          echo "检查 X86_X64 正式固件"
          echo "=================================================="


          if [ ! -d "./wrt/upload" ]; then

            echo "::error::upload 目录不存在！"

            exit 1

          fi


          echo
          echo "upload 目录："
          echo


          find ./wrt/upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          echo


          # ====================================================
          # Legacy / BIOS 镜像
          #
          # 排除 combined-efi
          # ====================================================

          LEGACY_IMAGE=$(

            find ./wrt/upload/ \
              -maxdepth 1 \
              -type f \
              -iname '*squashfs-combined*.img.gz' \
              ! -iname '*squashfs-combined-efi*.img.gz' \
              -print \
              -quit

          )


          # ====================================================
          # UEFI 镜像
          # ====================================================

          EFI_IMAGE=$(

            find ./wrt/upload/ \
              -maxdepth 1 \
              -type f \
              -iname '*squashfs-combined-efi*.img.gz' \
              -print \
              -quit

          )


          if [ -z "$LEGACY_IMAGE" ]; then

            echo
            echo "::error::没有找到 X86 Legacy / BIOS squashfs-combined.img.gz！"
            echo "::error::停止创建 GitHub Release。"
            echo

            exit 1

          fi


          if [ -z "$EFI_IMAGE" ]; then

            echo
            echo "::error::没有找到 X86 UEFI squashfs-combined-efi.img.gz！"
            echo "::error::停止创建 GitHub Release。"
            echo

            exit 1

          fi


          LEGACY_SIZE=$(stat -c%s "$LEGACY_IMAGE")

          EFI_SIZE=$(stat -c%s "$EFI_IMAGE")


          if [ "$LEGACY_SIZE" -lt 1048576 ]; then

            echo
            echo "::error::Legacy / BIOS 镜像大小异常：${LEGACY_SIZE} bytes"
            echo "::error::文件：$LEGACY_IMAGE"
            echo

            exit 1

          fi


          if [ "$EFI_SIZE" -lt 1048576 ]; then

            echo
            echo "::error::UEFI 镜像大小异常：${EFI_SIZE} bytes"
            echo "::error::文件：$EFI_IMAGE"
            echo

            exit 1

          fi


          echo
          echo "[OK] Legacy / BIOS 镜像："
          echo "$LEGACY_IMAGE"
          echo "大小：${LEGACY_SIZE} bytes"
          echo


          echo "[OK] UEFI 镜像："
          echo "$EFI_IMAGE"
          echo "大小：${EFI_SIZE} bytes"
          echo


          echo "[OK] X86_X64 本地固件验证成功"


      # ========================================================
      # TEST 模式
      #
      # TEST=true：
      #
      # 只生成 Config
      # 不编译固件
      # 不创建 Release
      # 不占最新10个正式固件名额
      # ========================================================

      - name: Test Mode Result

        if: env.WRT_TEST == 'true'

        run: |

          echo
          echo "=================================================="
          echo "TEST 模式"
          echo "=================================================="
          echo
          echo "只生成配置文件"
          echo "不编译 X86_X64 固件"
          echo "不创建 GitHub Release"
          echo
          echo "=================================================="


      # ========================================================
      # 创建 GitHub Release
      # ========================================================

      - name: Release Firmware

        if: env.WRT_TEST != 'true'

        uses: softprops/action-gh-release@v2.6.2

        with:

          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

          files: ./wrt/upload/*.*

          fail_on_unmatched_files: true

          body: |

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}


      # ========================================================
      # Release 上传后二次验证
      #
      # 必须确认 GitHub 上真实存在：
      #
      # Legacy / BIOS 镜像
      # UEFI 镜像
      # ========================================================

      - name: Verify Release Upload

        if: env.WRT_TEST != 'true'

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail


          TAG="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"


          echo "=================================================="
          echo "验证 GitHub X86_X64 Release"
          echo "=================================================="


          echo
          echo "Release Tag："
          echo "$TAG"
          echo


          ASSETS="$(

            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'

          )"


          echo
          echo "GitHub Release 中实际存在的附件："
          echo

          printf '%s\n' "$ASSETS"

          echo


          LEGACY_ASSET="$(

            printf '%s\n' "$ASSETS" \
              | grep -iE 'squashfs-combined.*\.img\.gz$' \
              | grep -iv 'squashfs-combined-efi' \
              | head -n 1 \
              || true

          )"


          EFI_ASSET="$(

            printf '%s\n' "$ASSETS" \
              | grep -iE 'squashfs-combined-efi.*\.img\.gz$' \
              | head -n 1 \
              || true

          )"


          if [ -z "$LEGACY_ASSET" ]; then

            echo
            echo "::error::GitHub Release 中没有找到 Legacy / BIOS combined 镜像！"
            echo "::error::Release 上传验证失败。"
            echo

            exit 1

          fi


          if [ -z "$EFI_ASSET" ]; then

            echo
            echo "::error::GitHub Release 中没有找到 UEFI combined-efi 镜像！"
            echo "::error::Release 上传验证失败。"
            echo

            exit 1

          fi


          echo
          echo "[OK] GitHub Release Legacy / BIOS："
          echo "$LEGACY_ASSET"
          echo


          echo "[OK] GitHub Release UEFI："
          echo "$EFI_ASSET"
          echo


          echo "=================================================="
          echo "Release 创建成功"
          echo "Legacy / BIOS 固件上传成功"
          echo "UEFI 固件上传成功"
          echo "X86_X64 Release 资产验证成功"
          echo "=================================================="
