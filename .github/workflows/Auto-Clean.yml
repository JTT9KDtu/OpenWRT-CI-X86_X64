# SPDX-License-Identifier: MIT

#固件保留最新的10个，多余的自动删除
name: Auto-Clean

on:
  #自动清理：每天上午9点（北京时间 UTC+8，即 UTC 01:00）
  #必须晚于编译结束时间：编译 03:00 开始、耗时约 2.5~3 小时，06:00 前后出 Release
  schedule:
    - cron: 0 1 * * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep only the newest releases
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          KEEP_NUM=10

          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt)
          TOTAL=$(echo "$RELEASES" | jq 'length')

          echo "当前固件总数：$TOTAL"
          echo "保留最新的：$KEEP_NUM 个"
          echo "=================================="

          if [ "$TOTAL" -le "$KEEP_NUM" ]; then
            echo "数量未超过 $KEEP_NUM 个，无需清理。"
            exit 0
          fi

          echo "【保留】"
          echo "$RELEASES" | jq -r --argjson n "$KEEP_NUM" \
            'sort_by(.createdAt) | reverse | .[:$n] | .[] | "  " + .tagName'

          echo "【删除】"
          echo "$RELEASES" | jq -r --argjson n "$KEEP_NUM" \
            'sort_by(.createdAt) | reverse | .[$n:] | .[].tagName' \
            | while read -r TAG; do
                [ -n "$TAG" ] || continue
                echo "  $TAG"
                gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done

          echo "=================================="
          echo "清理完成！"
