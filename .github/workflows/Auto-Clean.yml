- name: Clean old releases
  env:
    GH_TOKEN: ${{ github.token }}
  run: |
    KEEP_COUNT=10
    KEEP_DAYS=10

    echo "======================================"
    echo "Release 清理策略"
    echo "最近 $KEEP_DAYS 天全部保留"
    echo "最近 $KEEP_COUNT 个 Release 永久保底"
    echo "======================================"

    CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

    # 获取最新 Release ID
    LATEST_ID=$(gh api \
      "repos/${GITHUB_REPOSITORY}/releases/latest" \
      --jq '.id' 2>/dev/null || echo "")

    # GitHub API 默认按最新到最旧返回
    INDEX=0

    gh api \
      --paginate \
      "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
      --jq '.[] | [.id, .tag_name, (.published_at // .created_at)] | @tsv' |
    while IFS=$'\t' read -r RELEASE_ID TAG_NAME RELEASE_DATE; do

      INDEX=$((INDEX + 1))
      RELEASE_TIME=$(date -u -d "$RELEASE_DATE" +%s)

      echo "--------------------------------------"
      echo "Release #$INDEX"
      echo "Tag:  $TAG_NAME"
      echo "Date: $RELEASE_DATE"

      # 第一层保险：Latest 永远不删
      if [ "$RELEASE_ID" = "$LATEST_ID" ]; then
        echo "保留：Latest Release"
        continue
      fi

      # 第二层保险：最近10个永远不删
      if [ "$INDEX" -le "$KEEP_COUNT" ]; then
        echo "保留：属于最近 $KEEP_COUNT 个 Release"
        continue
      fi

      # 第三层保险：10天以内不删
      if [ "$RELEASE_TIME" -ge "$CUTOFF" ]; then
        echo "保留：发布时间未超过 $KEEP_DAYS 天"
        continue
      fi

      echo "删除：超过 $KEEP_DAYS 天，并且不属于最近 $KEEP_COUNT 个版本"

      gh api \
        --method DELETE \
        "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"

      gh api \
        --method DELETE \
        "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
        || true

    done
